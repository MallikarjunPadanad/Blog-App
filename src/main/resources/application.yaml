spring:
  application:
    name: blog

  datasource:
    url: jdbc:postgresql://localhost:5432/blog
    username: appuser
    password: "AppUser@123"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-make-it-at-least-32-bytes-long}
