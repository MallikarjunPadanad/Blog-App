spring:
  application:
    name: blog-app

  datasource:
    url: jdbc:postgresql://localhost:5432/blog
    username: appuser
    password: "AppUser@123"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false